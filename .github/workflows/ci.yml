name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q care_validator.py cli.py

      - name: Check browser JavaScript syntax
        run: node --check app.js

      - name: Verify Pyodide runtime
        if: matrix.python-version == '3.12'
        run: |
          npm install --no-save --ignore-scripts pyodide@0.29.5
          node tests/pyodide_smoke.mjs

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify CLI
        run: |
          care-case-report-validator benchmark
          care-case-report-validator validate --file sample_care_report.json --format json --output out_smoke.json
          care-case-report-validator batch -i sample.csv -o out_smoke.csv
