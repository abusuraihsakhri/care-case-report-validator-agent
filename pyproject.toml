[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "care-case-report-validator-engine"
version = "2.0.0"
description = "CARE-Validator Pro: Clinical Case Report Manuscript Guideline & Completeness Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
care-case-report-validator-engine = "care_case_report_validator_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/care-case-report-validator-engine"
Repository = "https://github.com/abusuraihsakhri/care-case-report-validator-engine.git"
